x-backend-image: &backend-image
  image: backend-dev:latest
  build:
    dockerfile: ./Dockerfile
    context: .
    target: dev
    args:
      USER_NAME: app-data
      USER_UID: ${RUN_AS_USER:-1000}
  env_file: ./.env
  environment:
    - TZ=UTC
    - GOPATH=/go
    - GOCACHE=/go-cache
    - APP_NAME=web-api
    - APP_COMMIT=${APP_COMMIT:-''}
    - APP_BUILD_AT=${APP_BUILD_AT:-''}
  volumes:
    - ./:/app
  networks:
    - traefik-4dev_network

services:
  backend:
    <<: *backend-image
    ports:
      - 3333:3333
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform-api.rule=Host(`platform.dev.com`) #&& PathPrefix(`/api/admin`)
      - traefik.http.routers.platform-api.entrypoints=websecure
      - traefik.http.routers.platform-api.tls=true

    command: go run cmd/app.go web --api all

  # ============================================================================
  # POSTGRESQL (Master + Replica)
  # ============================================================================
  postgres-master:
    image: postgres:17-alpine
    container_name: platform-postgres-master
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "${CONTAINER_POSTGRES_MASTER_PORT:-5432}:5432"
    volumes:
      - pg_master_data:/var/lib/postgresql/data
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        # Створюємо скрипт з явним абсолютним шляхом до pg_hba.conf
        mkdir -p /docker-entrypoint-initdb.d
        cat << 'EOF' > /docker-entrypoint-initdb.d/01-replication.sh
        #!/bin/sh
        echo "host replication all all trust" >> /var/lib/postgresql/data/pg_hba.conf
        EOF
        chmod +x /docker-entrypoint-initdb.d/01-replication.sh
        
        exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-replica:
    image: postgres:17-alpine
    container_name: platform-postgres-replica
    environment:
      PGPASSWORD: password
    ports:
      - "${CONTAINER_POSTGRES_REPLICA_PORT:-5433}:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Cloning master database for replication..."
          until pg_basebackup -h postgres-master -U app -D /var/lib/postgresql/data -Fp -Xs -P -R; do
            echo "Waiting for master to accept replication connections..."
            sleep 2
          done
          echo "Replication initialized successfully."
        fi
        exec docker-entrypoint.sh postgres
    depends_on:
      postgres-master:
        condition: service_healthy

  # ============================================================================
  # MARIADB
  # ============================================================================
  mariadb-db:
    image: mariadb:11.4
    container_name: platform-mariadb
    environment:
      - MARIADB_USER=app
      - MARIADB_PASSWORD=password
      - MARIADB_DATABASE=app
      - MARIADB_ROOT_PASSWORD=root_password
    ports:
      - "${CONTAINER_MARIA_DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CLICKHOUSE
  # ============================================================================
  clickhouse-db:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: platform-clickhouse
    ports:
      - "${CONTAINER_CLICKHOUSE_DB_INTERFACE_PORT:-8123}:8123" # HTTP інтерфейс
      - "${CONTAINER_CLICKHOUSE_DB_PORT:-9000}:9000" # Нативний клієнт
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  traefik-4dev_network:
    external: true

volumes:
  pg_master_data:
  pg_replica_data:
  mariadb_data:
  ch_data: