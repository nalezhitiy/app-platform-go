x-backend-image: &backend-image
  image: backend-dev:latest
  build:
    dockerfile: ./Dockerfile
    context: .
    target: dev
    args:
      USER_NAME: app-data
      USER_UID: ${RUN_AS_USER:-1000}

  env_file: ./.env

  environment:
    - TZ=UTC
    - GOPATH=/go
    - GOMODCACHE=/go/pkg/mod
    - GOCACHE=/go-cache
    - APP_NAME=web-api
    - APP_COMMIT=${APP_COMMIT:-''}
    - APP_BUILD_AT=${APP_BUILD_AT:-''}

  volumes:
    - ./:/app
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/go-cache

  depends_on:
    postgres-master:
      condition: service_healthy

  networks:
    - backend_network
    - traefik-4dev_network

services:
#  backend-web:
#    <<: *backend-image
#    ports:
#      - 3333:3333
#    labels:
#      - traefik.enable=true
#      - traefik.http.routers.platform-api.rule=Host(`platform.dev.com`) #&& PathPrefix(`/api/admin`)
