databases:
  postgres:
    primary_dsn: ${APP_POSTGRES_MASTER_DSN}
    replicas_dsn:
      - ${APP_POSTGRES_REPLICA_1_DSN}
    debug: true
    pool:
      min: 5
      max: 25
      lifetime: 900s
    orm:
      skip_default_transaction: true
      full_save_associations: true
      prepare_stmt: false
      create_batch_size: 1000
      translate_error: true

  mariadb:
    primary_dsn: ${APP_MARIADB_DSN}
    debug: true
    pool:
      min: 3
      max: 15
      lifetime: 600s
    orm:
      skip_default_transaction: true
      full_save_associations: true
      prepare_stmt: false
      create_batch_size: 1000
      translate_error: true

  clickhouse:
    primary_dsn: ${APP_CLICKHOUSE_DSN}
    debug: true
    pool:
      min: 2
      max: 10
      lifetime: 1800s
    orm:
      skip_default_transaction: true
      full_save_associations: false
      prepare_stmt: false
      create_batch_size: 1000
      translate_error: false