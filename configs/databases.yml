database:
  postgres:
    dsn: ${APP_POSTGRES_MASTER_DSN}
    replica_dsn: ${APP_POSTGRES_REPLICA_DSN}
    debug: true
    pool:
      min: 5
      max: 25
      lifetime: 900s
    orm:
      skip_default_transaction: true # Вимикаємо для швидкості, якщо не треба автоматичні транзакції
      full_save_associations: true

  mariadb:
    dsn: ${APP_MARIADB_DSN}
    debug: false
    pool:
      min: 3
      max: 15
      lifetime: 600s
    orm:
      skip_default_transaction: false
      full_save_associations: true

  clickhouse:
    dsn: ${APP_CLICKHOUSE_DSN}
    debug: false
    pool:
      min: 2
      max: 10
      lifetime: 1800s
    orm:
      skip_default_transaction: true
      full_save_associations: false