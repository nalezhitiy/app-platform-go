  backend-admin:
    <<: *backend-image
    command: [ "sh", "-c", "go mod download && exec go run cmd/app.go web --api admin" ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform-admin.rule=Host(`platform.dev.com`) && PathPrefix(`/api/admin`)
      - traefik.http.routers.platform-admin.entrypoints=websecure
      - traefik.http.routers.platform-admin.tls=true
      - traefik.http.services.platform-admin.loadbalancer.server.port=3333

  backend-portal:
    <<: *backend-image
    command: [ "sh", "-c", "go mod download && exec go run cmd/app.go web --api portal" ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform-portal.rule=Host(`platform.dev.com`) && PathPrefix(`/api/portal`)
      - traefik.http.routers.platform-portal.entrypoints=websecure
      - traefik.http.routers.platform-portal.tls=true
      - traefik.http.services.platform-portal.loadbalancer.server.port=3333

#  backend-cron:
#    <<: *backend-image
#    command: [ "sh", "-c", "go run cmd/app.go cron" ]
#
#  backend-workers:
#    <<: *backend-image
#    command: [ "sh", "-c", "go run cmd/app.go workers" ]

  # ============================================================================
  # POSTGRESQL (Master + Replica)
  # ============================================================================
  postgres-master:
    image: postgres:17-alpine
    container_name: platform-postgres-master
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "${CONTAINER_POSTGRES_MASTER_PORT:-5432}:5432"
    volumes:
      - pg_master_data:/var/lib/postgresql/data
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        # Створюємо скрипт з явним абсолютним шляхом до pg_hba.conf
        mkdir -p /docker-entrypoint-initdb.d
        cat << 'EOF' > /docker-entrypoint-initdb.d/01-replication.sh
        #!/bin/sh
        echo "host replication all all trust" >> /var/lib/postgresql/data/pg_hba.conf
        EOF
        chmod +x /docker-entrypoint-initdb.d/01-replication.sh
        
        exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - backend_network

  postgres-replica:
    image: postgres:17-alpine
    container_name: platform-postgres-replica
    environment:
      PGPASSWORD: password
    ports:
      - "${CONTAINER_POSTGRES_REPLICA_PORT:-5433}:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Cloning master database for replication..."
          until pg_basebackup -h postgres-master -U app -D /var/lib/postgresql/data -Fp -Xs -P -R; do
            echo "Waiting for master to accept replication connections..."
            sleep 2
          done
          echo "Replication initialized successfully."
        fi
        exec docker-entrypoint.sh postgres
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - backend_network

  # ============================================================================
  # MARIADB
  # ============================================================================
  mariadb-db:
    image: mariadb:11.4
    container_name: platform-mariadb
    environment:
      - MARIADB_USER=app
      - MARIADB_PASSWORD=password
      - MARIADB_DATABASE=app
      - MARIADB_ROOT_PASSWORD=root_password
    ports:
      - "${CONTAINER_MARIA_DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  # ============================================================================
  # CLICKHOUSE
  # ============================================================================
  clickhouse-db:
    image: clickhouse/clickhouse-server:25.8
    container_name: platform-clickhouse
    environment:
      CLICKHOUSE_DB: app
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CONTAINER_CLICKHOUSE_DB_INTERFACE_PORT:-8123}:8123" # HTTP інтерфейс
      - "${CONTAINER_CLICKHOUSE_DB_PORT:-9000}:9000" # Нативний клієнт
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend_network

networks:
  backend_network:
  traefik-4dev_network:
    external: true

volumes:
  pg_master_data:
  pg_replica_data:
  mariadb_data:
  ch_data:
  redis-data:

  # golang libs cache
  go-mod-cache:
  go-build-cache: